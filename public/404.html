<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | Mavens Advisor</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f6f7f4; color: #050505; font-family: Arial, sans-serif; }
      .hero { min-height: 440px; display: flex; align-items: flex-end; position: relative; overflow: hidden; padding: 70px 24px; color: #fff; background: radial-gradient(circle at 18% 55%, rgba(12,127,254,.3), transparent 34%), linear-gradient(120deg, #050505 0%, #101820 55%, #050505 100%); }
      .container { width: min(100%, 1400px); margin: 0 auto; }
      .eyebrow { margin-bottom: 16px; color: #78b5ff; font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(86px, 12vw, 140px); line-height: .9; letter-spacing: -.05em; }
      main { padding: clamp(80px, 9vw, 120px) 24px; }
      h2 { max-width: 850px; margin: 0; font-size: clamp(40px, 5vw, 58px); line-height: 1.1; letter-spacing: -.035em; }
      p { max-width: 720px; margin: 24px 0 0; color: #6b6b6b; font-size: 18px; line-height: 1.75; }
      a { display: inline-flex; margin-top: 36px; padding: 18px 28px; border-radius: 12px; color: #fff; font-weight: 700; text-decoration: none; background: linear-gradient(90deg, #0c7ffe, #0058a8); }
      footer { padding: 34px 24px; background: #050505; color: rgba(255,255,255,.65); text-align: center; }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="container">
        <div class="eyebrow">Page Not Found</div>
        <h1>404</h1>
      </div>
    </section>
    <main>
      <section class="container">
        <h2>This Page Is No Longer Here</h2>
        <p>The address may be incorrect, or the page may have moved. Return to the homepage and continue exploring Mavens Advisor.</p>
        <a href="/">Return to Home</a>
      </section>
    </main>
    <footer>© Mavens Advisor</footer>
  </body>
</html>
